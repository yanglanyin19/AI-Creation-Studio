<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 创作工作台</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 20%, #1f1d1a 0%, #0c0b0a 55%, #050505 100%);
    color: #f5f5f4;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .wrap { text-align: center; padding: 48px; }
  .badge {
    display: inline-block;
    padding: 8px 14px;
    border: 1px solid #44403c;
    border-radius: 999px;
    color: #d6d3d1;
    font-size: 14px;
    letter-spacing: .08em;
  }
  h1 { margin: 28px 0 16px; font-size: 72px; letter-spacing: -.04em; }
  .sub { color: #a8a29e; font-size: 22px; letter-spacing: .04em; }
  .chips { margin-top: 34px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .chip { padding: 10px 16px; border-radius: 10px; background: #1c1917; border: 1px solid #292524; color: #d6d3d1; font-size: 15px; }
  .foot { margin-top: 46px; color: #57534e; font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">TRAE 好应用大赏赛 · 参赛作品</div>
    <h1>AI 创作工作台</h1>
    <div class="sub">无限画布 · 图片 / 视频生成 · BYOK · Agent 原生</div>
    <div class="chips">
      <span class="chip">一句话开始创作</span>
      <span class="chip">4 个预设画布模板</span>
      <span class="chip">Agent 直接读写画布</span>
      <span class="chip">万相 3.0 视频协议</span>
    </div>
    <div class="foot">基于 basketikun/infinite-canvas（MIT）二次开发 · v0.0.1</div>
  </div>
</body>
</html>
